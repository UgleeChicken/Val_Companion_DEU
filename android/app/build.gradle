plugins {
    id "com.android.application"
}

// Auf GitHub zählt jede Build-Nummer die Version hoch, damit Updates sich installieren lassen.
def buildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

// Git-Hash des docs/-Ordners: So erkennt die App, ob ein Web-Update neuer ist als die eingebaute Version.
def docsTree = ""
try {
    docsTree = ["git", "rev-parse", "HEAD:docs"].execute(null, rootDir).text.trim()
} catch (Exception ignored) {
    // Ohne git (z. B. aus einem ZIP gebaut) bietet die App jedes Web-Update an.
}

// Repo, dessen Releases die App nach Web-Updates fragt. Auf GitHub das Repo, in dem gebaut wird,
// so lässt sich der ganze Ablauf auch in einem Fork testen.
def releasesRepo = System.getenv("GITHUB_REPOSITORY") ?: "UgleeChicken/Val_Companion_DEU"

android {
    namespace "de.ugleechicken.valcompanion"
    compileSdk 36

    defaultConfig {
        applicationId "de.ugleechicken.valcompanion"
        minSdk 24
        targetSdk 36
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
        buildConfigField "String", "DOCS_TREE", "\"${docsTree}\""
        buildConfigField "String", "RELEASES_REPO", "\"${releasesRepo}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        // Öffentlicher Test-Schlüssel für die APK zum direkten Installieren (GitHub-Releases).
        // Bleibt gleich, damit neue APKs sich über die alte App installieren lassen.
        shared {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        // Geheimer Upload-Schlüssel für den Play Store. Kommt nur über GitHub-Secrets in den Build
        // (UPLOAD_KEYSTORE_FILE und UPLOAD_KEYSTORE_PASSWORD), nie ins Repository.
        if (System.getenv("UPLOAD_KEYSTORE_FILE")) {
            upload {
                storeFile file(System.getenv("UPLOAD_KEYSTORE_FILE"))
                storePassword System.getenv("UPLOAD_KEYSTORE_PASSWORD")
                keyAlias "upload"
                keyPassword System.getenv("UPLOAD_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            // Mit Upload-Schlüssel (Play Store) oder sonst mit dem öffentlichen Test-Schlüssel (APK)
            signingConfig System.getenv("UPLOAD_KEYSTORE_FILE") ? signingConfigs.upload : signingConfigs.shared
        }
    }

    // Die Web-App aus docs/ wird als App-Inhalt mitgeliefert.
    sourceSets {
        main {
            assets.srcDirs = ["${rootDir}/../docs"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Lädt die App-Dateien über eine sichere https-Adresse (nötig für Online-Partien)
    implementation "androidx.webkit:webkit:1.11.0"
}
