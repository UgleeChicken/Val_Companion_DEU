plugins {
    id "com.android.application"
}

// Auf GitHub zählt jede Build-Nummer die Version hoch, damit Updates sich installieren lassen.
def buildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

android {
    namespace "de.ugleechicken.valheim"
    compileSdk 34

    defaultConfig {
        applicationId "de.ugleechicken.valheim"
        minSdk 24
        targetSdk 34
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    // Fester Schlüssel, damit neue Versionen die alte überschreiben können.
    // Das ist ein Test-Schlüssel – für den Play Store bräuchte es einen eigenen, geheimen Schlüssel.
    signingConfigs {
        shared {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    // Die Web-App aus docs/ wird als App-Inhalt mitgeliefert.
    sourceSets {
        main {
            assets.srcDirs = ["${rootDir}/../docs"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
