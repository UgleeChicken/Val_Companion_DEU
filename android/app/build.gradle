plugins {
    id "com.android.application"
}

// Auf GitHub zählt jede Build-Nummer die Version hoch, damit Updates sich installieren lassen.
def buildNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()

// Git-Hash des docs/-Ordners: So erkennt die App, ob ein Web-Update neuer ist als die eingebaute Version.
def docsTree = ""
try {
    docsTree = ["git", "rev-parse", "HEAD:docs"].execute(null, rootDir).text.trim()
} catch (Exception ignored) {
    // Ohne git (z. B. aus einem ZIP gebaut) bietet die App jedes Web-Update an.
}

// Repo, dessen Releases die App nach Web-Updates fragt. Auf GitHub das Repo, in dem gebaut wird,
// so lässt sich der ganze Ablauf auch in einem Fork testen.
def releasesRepo = System.getenv("GITHUB_REPOSITORY") ?: "UgleeChicken/Val_Companion_DEU"

android {
    namespace "de.ugleechicken.valcompanion"
    compileSdk 34

    defaultConfig {
        applicationId "de.ugleechicken.valcompanion"
        minSdk 24
        targetSdk 34
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
        buildConfigField "String", "DOCS_TREE", "\"${docsTree}\""
        buildConfigField "String", "RELEASES_REPO", "\"${releasesRepo}\""
    }

    buildFeatures {
        buildConfig true
    }

    // Fester Schlüssel, damit neue Versionen die alte überschreiben können.
    // Das ist ein Test-Schlüssel – für den Play Store bräuchte es einen eigenen, geheimen Schlüssel.
    signingConfigs {
        shared {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shared
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shared
        }
    }

    // Die Web-App aus docs/ wird als App-Inhalt mitgeliefert.
    sourceSets {
        main {
            assets.srcDirs = ["${rootDir}/../docs"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Lädt die App-Dateien über eine sichere https-Adresse (nötig für Online-Partien)
    implementation "androidx.webkit:webkit:1.11.0"
}
