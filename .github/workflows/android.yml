name: Android-App bauen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: APK bauen
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/release/app-release.apk Val-Companion.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Val-Companion-APK
          path: Val-Companion.apk

      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ github.run_number }}
          name: Val Companion ${{ github.run_number }}
          body: |
            Android-App, automatisch gebaut aus ${{ github.sha }}.
            Auf dem Handy die Datei **Val-Companion.apk** herunterladen und öffnen.
          files: Val-Companion.apk
          make_latest: true
